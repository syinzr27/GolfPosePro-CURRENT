  // Position model root so hip bone aligns with MediaPipe hip center, moved
  // over the ground by the clip's body shift (see clipFootPlant).
  if (hipCtr) {
    const shift = (sceneObj.rootShift && sceneObj.rootShift[frameIdx]) || { x: 0, y: 0, z: 0 };
    model.position.set(hipCtr.x + shift.x, hipCtr.y - sceneObj.hipRestY + shift.y, hipCtr.z + shift.z);
    model.updateMatrixWorld(true);
  }

  // Pelvis turn — before the spine and legs, which are its children and are
  // then aimed in world space on top of it.
  if (lm23 && lm24) drivePelvis(bones, lm24.clone().sub(lm23));

  // Spine (interpolate along hip→shoulder axis)
  const sp1 = lerpPts(hipCtr, shoulderCtr, 0.33);
  const sp2 = lerpPts(hipCtr, shoulderCtr, 0.66);

  const drive = (name, from, to) => {
    if (from && to) driveBone(bones, name, to.clone().sub(from));
  };

  // Spine chain (parent → child order is critical). The twist is shared out
  // along it — a third, two thirds, then all of the way from the hip line to
  // the shoulder line — so the chest turns with the shoulders and the gap
  // between hip and shoulder turn (the X-factor) shows as a wound-up torso.
  const hipSide = (lm23 && lm24) ? lm24.clone().sub(lm23).normalize() : null;
  const shSide  = (lm11 && lm12) ? lm12.clone().sub(lm11).normalize() : null;
  const twistDrive = (name, from, to, t) => {
    if (!from || !to) return;
    if (hipSide && shSide) driveBoneTwisted(bones, name, to.clone().sub(from), hipSide.clone().lerp(shSide, t));
    else drive(name, from, to);
  };
  twistDrive(B('Spine'),  hipCtr, sp1,         1 / 3);
  twistDrive(B('Spine1'), sp1,    sp2,         2 / 3);
  twistDrive(B('Spine2'), sp2,    shoulderCtr, 1);
  // Head/neck. The neck runs up to the ears, the skull's centre line, and the
  // top of the head points square to the ear→nose line, so the head nods with
  // the face (forward at address, looking down at the ball) without leaning
  // toward wherever the face points. Aimed at the mouth and then the nose, it
  // leant the whole head ~30° toward the face — 50–60° from the top of the
  // follow-through, the face side-on to the camera — so the rig's head stood
  // out over the lead shoulder in the finish on TigerWoodsDriver.mov, where
  // the golfer's sits upright over his shoulders.
  if (earCtr && shoulderCtr) {
    const neckDir = earCtr.clone().sub(shoulderCtr);
    driveBone(bones, B('Neck'), neckDir);
    const headUp = neckDir.clone();
    if (lm0) {
      const face = lm0.clone().sub(earCtr);
      if (face.lengthSq() > 1e-8) headUp.projectOnPlane(face.normalize());
    }
    if (headUp.lengthSq() > 1e-8) driveBone(bones, B('Head'), headUp);
  } else {
    drive(B('Neck'),   shoulderCtr, mouthCtr);
    drive(B('Head'),   mouthCtr,    lm0);
  }

  // Leg chains — after the 180° Y rotation the model's anatomical "Left" bone
  // sits on the camera's LEFT = subject's RIGHT side, so drive it with the
  // subject's RIGHT leg landmarks (lm24/26/28/30/32), and vice-versa. Driven
  // before the arms so the body can be set down on the ground (below) before
  // the club and hands are placed in world space.
  drive(B('LeftUpLeg'), lm24, lm26);
  drive(B('LeftLeg'),   lm26, lm28);
  const flat = sceneObj.flatFootPitch || {};
  const flatPitch = side => flat[side] || 0;
  const footPose = side => (sceneObj.footPose && sceneObj.footPose[side][frameIdx]) || null;
  const layLeft  = () => driveFootFlat(bones, 'Left',  lm30, lm32, lm28, flatPitch('Left'),  footPose('Left'));
  const layRight = () => driveFootFlat(bones, 'Right', lm29, lm31, lm27, flatPitch('Right'), footPose('Right'));
  layLeft();
  drive(B('RightUpLeg'), lm23, lm25);
  drive(B('RightLeg'),   lm25, lm27);
  layRight();
  if (!sceneObj.plantOff) {
    const poles = sceneObj.kneePole && sceneObj.kneePole[frameIdx];
    plantFeet(sceneObj, { Left: layLeft, Right: layRight }, poles || null);
  }

  // Clavicles — before the club, which is placed off the shoulder joints
  // they leave the rig with. Then the chest and clavicles are corrected so the
  // shoulder joints land where the video's are (see placeShoulders).
  drive(B('LeftShoulder'),  shoulderCtr, lm12);
  drive(B('RightShoulder'), shoulderCtr, lm11);
  placeShoulders(bones, sceneObj.torsoFit, hipCtr, shoulderCtr, { Left: lm12, Right: lm11 }, armScale);

  // ── Hand-on-club targets ──
  // When a club is detected, both wrists are forced to converge on the grip
  // (nudged slightly toward the curled-finger "tunnel", see gripWristTarget)
  // and both hands rotate so their knuckle row wraps the shaft. This visually
  // locks both hands onto the club. When no club is present, fall back to
  // driving each forearm to its own wrist landmark.
  let gripVec = null;
  let shaftEndVec = null;
  let shaftDir = null;
  let handPoint = null;   // side → point on the shaft where that hand grips
  let knuckleDir = null;  // side → which way that hand's knuckles face
  let buttExtend = 0;     // how far the butt pokes out past the topmost hand
  if (clubFrame && clubFrame.has_club && clubFrame.grip && clubFrame.shaft_end) {
    const rawGrip = new THREE.Vector3(clubFrame.grip.x,      -clubFrame.grip.y,      -clubFrame.grip.z);
    const rawEnd  = new THREE.Vector3(clubFrame.shaft_end.x, -clubFrame.shaft_end.y, -clubFrame.shaft_end.z);
    const dir = rawEnd.clone().sub(rawGrip);
    if (dir.lengthSq() > 1e-8) {
      // How each hand is rolled around the shaft, measured from the video's
      // own hand landmarks (see measuredKnuckleDir).
      knuckleDir = {
        Left:  measuredKnuckleDir(lm, 'Left',  lm14, lm16),
        Right: measuredKnuckleDir(lm, 'Right', lm13, lm15),
      };
      // The club is hung off the RIG's shoulders, the same offset from them as
      // from the video's. Placed in the landmarks' own coordinates it ignored
      // that the rig's torso is built differently (its shoulder joints sit
      // ~5 cm lower than MediaPipe's on TigerWoodsDriver.mov): as the torso
      // turned, that gap swung the grip nearer and further from the rig's
      // shoulders than the arms could follow, so the hands either fell off the
      // club or the arms buckled to reach it. The offset and the club are
      // sized to the rig by the same torso ratio as its shoulders and arms
      // (see placeShoulders, clipArmScale) — at the golfer's own size they
      // were ~11% too big for the rig's body, hanging the hands low at address
      // and the club head well under the ground. Rendering only — the metrics
      // use the club data as estimated.
      const rigShoulders = bodyShoulderCentre(bones);
      const k = sceneObj.torsoFit ? sceneObj.torsoFit.len : 1;
      const shift = palmShift(knuckleDir);
      if (rigShoulders && shoulderCtr) {
        const offset = rawGrip.clone().sub(shoulderCtr).multiplyScalar(k);
        rawGrip.copy(rigShoulders).add(offset);
        dir.multiplyScalar(k);
        rawEnd.copy(rawGrip).add(dir);
      }
      gripVec     = rawGrip.add(shift);
      shaftEndVec = rawEnd.add(shift);
      if (finish && finish.w) finish.fix = finishClubFix(bones, gripVec, shaftEndVec, finish.w, sceneObj.finishBack,
                                                         clubFrame.screen_frac, clubFrame.grip_from_head);
      else if (finish) {
        // The hands turn with the club: the knuckles are measured against the
        // landmarks' club, and left there while the shaft is tilted toward the
        // camera they ended up pointing along it (173° on steelpwedge1.mov at
        // 314), where the hand's roll round the shaft is undefined and the
        // fists spun about it.
        const before = shaftEndVec.clone().sub(gripVec).normalize();
        applyClubFix(gripVec, shaftEndVec, finish);
        const turn = new THREE.Quaternion().setFromUnitVectors(
          before, shaftEndVec.clone().sub(gripVec).normalize());
        ['Left', 'Right'].forEach(s => { if (knuckleDir[s]) knuckleDir[s].applyQuaternion(turn); });
      }
      shaftDir    = shaftEndVec.clone().sub(gripVec);
      const shaftUnit = shaftDir.clone().normalize();
      // Lead hand on top, trail hand directly below it (see gripHandPoints).
      handPoint = gripHandPoints(gripVec, shaftUnit, sceneObj.leadSide);
      // Butt cap: the club has to continue past whichever hand is highest on
      // it, or the shaft appears to start inside the fists. Which hand that is
      // comes from the data, so left- and right-handed golfers both work
      // without being told which.
      const topT = Math.min(
        handPoint.Left.clone().sub(gripVec).dot(shaftUnit),
        handPoint.Right.clone().sub(gripVec).dot(shaftUnit));
      buttExtend = Math.max(0, -topT) + BUTT_CAP_M;
    }
  }
  // Upper arms follow the landmarks directly (re-aimed at the grip below when
  // there is a club). Rig "Left" takes the subject's RIGHT arm (see ARM_LM).
  drive(B('LeftArm'),       lm12,        lm14);
  drive(B('RightArm'),      lm11,        lm13);

  // Hands wrap around the shaft: the knuckle-row axis (not the fingers'
  // pointing direction) is aligned with the shaft, and fingers curl into a
  // fist around it — see orientHandOnGrip / curlFingers. Falls back to an
  // open hand driven toward the forearm→wrist landmark when no club is
  // detected.
  if (gripVec && shaftDir) {
    // The forearm's rotation must be aimed from its own CURRENT world
    // position, not the (slightly different, due to fixed rest-length
    // mismatch) upper-arm landmark — orientHandOnGrip's stretch step below
    // measures distance from that same actual position, and if the
    // rotation were aimed from a different point the two would disagree on
    // which direction is "toward the target", sending the stretched hand
    // off at an angle instead of onto the grip.
    const shaftUnit = shaftDir.clone().normalize();
    // Through the finish the trail elbow points where the chest faces (see
    // aimUpperArmAtGrip): square to the rig's shoulder line, on the side
    // the subject's left shoulder (rig "Right", see ARM_LM) is to the left
    // of.
    let trailElbow = null;
    if (finish && !finish.w && finish.up > 0) {
      const subjL = bones[B('RightArm')], subjR = bones[B('LeftArm')];
      if (subjL && subjR) {
        const chest = subjL.getWorldPosition(new THREE.Vector3())
          .sub(subjR.getWorldPosition(new THREE.Vector3()))
          .cross(new THREE.Vector3(0, 1, 0));
        if (chest.lengthSq() > 1e-8) trailElbow = { dir: chest.normalize(), k: finish.up };
      }
    }
    ['Left', 'Right'].forEach(side => {
      const wristTarget = gripWristTarget(side, handPoint[side], shaftDir, knuckleDir[side]);
      const a = ARM_LM[side];
      aimUpperArmAtGrip(bones, side, lm(a.shoulder), lm(a.elbow), lm(a.wrist), wristTarget, armScale,
                        side === sceneObj.leadSide ? null : trailElbow);
      driveForeArmToGrip(bones, side, wristTarget);
      orientHandOnGrip(bones, side, handPoint[side], shaftDir, knuckleDir[side], armScale);
      curlFingers(bones, side, 1);
      layThumbAlongShaft(bones, side, handPoint[side], shaftUnit);
    });
  } else {
    drive(B('LeftForeArm'),  lm14, lm16);
    drive(B('RightForeArm'), lm13, lm15);
    if (lm14 && lm16) drive(B('LeftHand'),  lm14, lm16);
    if (lm13 && lm15) drive(B('RightHand'), lm13, lm15);
    curlFingers(bones, 'Left',  0);
    curlFingers(bones, 'Right', 0);
    // Undo any forearm/hand stretch left over from a club-gripping frame.
    resetForearmStretch(bones, 'Left', armScale);
    resetForearmStretch(bones, 'Right', armScale);
  }
  // Note: hand pivots are already pinned to the grip (tunnel-offset-adjusted)
  // inside orientHandOnGrip above — the arm/leg bone CHAINS above stay
  // rotation-only so the rig's proportions (clavicle, spine, hip) are
  // preserved; only the leaf HAND bones get their position overridden.

  // Club shaft + head + swing trail. Drawn at the palm-shifted position worked
  // out above so the rendered club is the same one the hands are gripping.
  if (gripVec && shaftEndVec && shaftDir) {
    const grip = gripVec;
    const end  = shaftEndVec;
    const len  = shaftDir.length();
    const unit = shaftDir.clone().normalize();

    // Start the shaft above the topmost hand (see buttExtend) so the club runs
    // through the grip and out the top, instead of beginning inside the fists.
    sceneObj.shaft.position.copy(grip).addScaledVector(unit, -buttExtend);
    sceneObj.shaft.scale.set(1, len + buttExtend, 1);
    sceneObj.shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), unit);
    sceneObj.shaft.visible = true;

    sceneObj.clubhead.position.copy(end);
    sceneObj.clubhead.visible = true;

    // Trail
    const tp = sceneObj.trailPositions;
    if (sceneObj.trailCount < sceneObj.trailMax) {
      const idx = sceneObj.trailCount;
      tp[idx * 3] = end.x; tp[idx * 3 + 1] = end.y; tp[idx * 3 + 2] = end.z;
      sceneObj.trailCount++;
    } else {
      for (let i = 0; i < (sceneObj.trailMax - 1) * 3; i++) tp[i] = tp[i + 3];
      const last = (sceneObj.trailMax - 1) * 3;
      tp[last] = end.x; tp[last + 1] = end.y; tp[last + 2] = end.z;
    }
    sceneObj.trail.geometry.attributes.position.needsUpdate = true;
    sceneObj.trail.geometry.setDrawRange(0, Math.min(sceneObj.trailCount, sceneObj.trailMax));
  } else {
    sceneObj.shaft.visible = false;
    sceneObj.clubhead.visible = false;
  }

  // Push driven bone matrices into SkinnedMesh GPU skinning buffers
  model.traverse(obj => {
    if (obj.isSkinnedMesh) obj.skeleton.update();
  });
}

// ── Phase color → tint Soldier's SkinnedMesh materials ──
function applyPhaseColor(sceneObj, frameIdx, phases = phaseData, updateBadge = true) {
  let phaseColor = 0x4ade80;
  for (const [phase, range] of Object.entries(phases)) {
    if (frameIdx >= range.start && frameIdx <= range.end) {
      phaseColor = parseInt((phaseColors[phase] || '#4ade80').replace('#', ''), 16);
      if (!updateBadge) break;
      phaseBadge.textContent = phase;
      phaseBadge.style.background = phaseColors[phase] + '26';
      phaseBadge.style.color = phaseColors[phase];
      phaseBadge.style.border = '1px solid ' + phaseColors[phase] + '4d';
      break;
    }
  }
  if (sceneObj.soldierModel) {
    sceneObj.soldierModel.traverse(obj => {
      if ((obj.isMesh || obj.isSkinnedMesh) && obj.material) {
        obj.material.color.setHex(phaseColor);
      }
    });
  }
}

// Map student frame to pro frame. The two clips have their own lengths and
// swing timing, so anchor the matching phase boundaries of both swings (and
// the DTW-matched midpoint inside each phase) and interpolate between them.
// dtwAlignment holds [studentMid, proMid, dist] per phase, not a pro range.
function buildComparisonAnchors() {
  const last = comparisonPose.length - 1;
  const anchors = [[0, 0], [TOTAL - 1, last]];
  for (const [phase, sRange] of Object.entries(phaseData)) {
    const pRange = comparisonPhaseData[phase];
    if (!pRange) continue;
    anchors.push([sRange.start, pRange.start], [sRange.end, pRange.end]);
    const a = dtwAlignment && dtwAlignment[phase];
    if (a && a[0] > sRange.start && a[0] < sRange.end
          && a[1] > pRange.start && a[1] < pRange.end) {
      anchors.push([a[0], a[1]]);
    }
  }
  anchors.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  // Keep the mapping monotonic so the pro never plays backwards.
  const out = [];
  for (const [s, p] of anchors) {
    const pc = Math.min(Math.max(p, 0), last);
    const prev = out[out.length - 1];
    if (prev && (s <= prev[0] || pc < prev[1])) continue;
    out.push([s, pc]);
  }
  return out;
}
const comparisonAnchors = isComparison ? buildComparisonAnchors() : [];

function getComparisonFrame(studentFrameIdx) {
  const last = comparisonPose.length - 1;
  const A = comparisonAnchors;
  for (let i = 1; i < A.length; i++) {
    if (studentFrameIdx <= A[i][0]) {
      const [s0, p0] = A[i - 1];
      const [s1, p1] = A[i];
      const t = (s1 > s0) ? (studentFrameIdx - s0) / (s1 - s0) : 0;
      return Math.min(Math.max(Math.round(p0 + t * (p1 - p0)), 0), last);
    }
  }
  const ratio = studentFrameIdx / Math.max(TOTAL - 1, 1);
  return Math.min(Math.round(ratio * last), last);
}

// ── Controls ──
const playBtn     = document.getElementById('play-btn');
const scrubber    = document.getElementById('scrubber');
const frameLabel  = document.getElementById('frame-label');
const phaseBadge  = document.getElementById('phase-badge');
const speedSelect = document.getElementById('speed-select');
const resetCamBtn = document.getElementById('reset-cam-btn');

scrubber.max = TOTAL - 1;
let currentFrame = 0;
let playing = false;
let playbackSpeed = 1.0;
let lastTime = 0;
let accumulator = 0;

const fps = (TOTAL > 1 && poseData[1].timestamp_ms > 0)
  ? 1000 / (poseData[1].timestamp_ms - poseData[0].timestamp_ms) : 30;

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? 'Pause' : 'Play';
  if (playing) { lastTime = performance.now(); accumulator = 0; }
});

scrubber.addEventListener('input', () => {
  currentFrame = parseInt(scrubber.value);
  resetTrail(mainScene);
  if (compScene) resetTrail(compScene);
});

speedSelect.addEventListener('change', () => {
  playbackSpeed = parseFloat(speedSelect.value);
});

resetCamBtn.addEventListener('click', () => {
  camera.position.set(...CAM_POS);
  controls.target.set(...CAM_TARGET);
  controls.update();
  if (camera2) {
    camera2.position.set(...CAM_POS);
    controls2.target.set(...CAM_TARGET);
    controls2.update();
  }
});

function resetTrail(sceneObj) {
  sceneObj.trailCount = 0;
  sceneObj.trail.geometry.setDrawRange(0, 0);
}

// ── Animation loop (started after GLB loads) ──
function animate(time) {
  requestAnimationFrame(animate);

  if (playing) {
    const dt = (time - lastTime) / 1000;
    lastTime = time;
    accumulator += dt * playbackSpeed * fps;
    if (accumulator >= 1) {
      const step = Math.floor(accumulator);
      currentFrame = (currentFrame + step) % TOTAL;
      accumulator -= step;
    }
  }

  const fi = Math.floor(currentFrame);

  updateSkeleton(mainScene, poseData[fi], clubData[fi], mainScene.finishFix[fi], fi);
  applyPhaseColor(mainScene, fi);

  scrubber.value = fi;
  frameLabel.textContent = `${fi} / ${TOTAL - 1}`;

  controls.update();

  if (isComparison) {
    const w = container.clientWidth;
    const h = container.clientHeight;
    const halfW = Math.floor(w / 2);

    const compIdx = getComparisonFrame(fi);
    updateSkeleton(compScene, comparisonPose[compIdx], comparisonClub[compIdx], compScene.finishFix[compIdx],
                   compIdx);
    applyPhaseColor(compScene, compIdx,
      Object.keys(comparisonPhaseData).length ? comparisonPhaseData : phaseData, false);

    renderer.setScissorTest(true);

    renderer.setViewport(0, 0, halfW, h);
    renderer.setScissor(0, 0, halfW, h);
    camera.aspect = halfW / h;
    camera.updateProjectionMatrix();
    renderer.render(mainScene.scene, camera);

    renderer.setViewport(halfW, 0, w - halfW, h);
    renderer.setScissor(halfW, 0, w - halfW, h);
    camera2.aspect = (w - halfW) / h;
    camera2.updateProjectionMatrix();
    renderer.render(compScene.scene, camera2);

    renderer.setScissorTest(false);
    controls2.update();
  } else {
    renderer.render(mainScene.scene, camera);
  }
}

// Handle resize
window.addEventListener('resize', () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  renderer.setSize(w, h);
  if (!isComparison) {
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
});
</script>
